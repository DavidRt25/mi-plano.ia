<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapVibe Pro | Cloud Sync</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- Scripts de Firebase para base de datos en tiempo real -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        #map-container { height: calc(100vh - 120px); border-radius: 2rem; overflow: hidden; position: relative; background: #f1f5f9; }
        #map { height: 100%; width: 100%; }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .custom-marker { display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.2); border: 2px solid white; transition: transform 0.2s; }
        .custom-marker:hover { transform: scale(1.2); z-index: 1000 !important; }
        #editor-desc table { border-collapse: collapse; width: 100%; border: 1px solid #e2e8f0; }
        #editor-desc td { border: 1px solid #e2e8f0; padding: 4px; font-size: 0.75rem; }
    </style>
</head>
<body class="h-screen overflow-hidden p-4 md:p-6">

    <nav class="h-16 mb-6 flex items-center justify-between px-2">
        <div class="flex items-center gap-4">
            <div class="bg-indigo-600 p-2.5 rounded-2xl shadow-xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-extrabold text-slate-800">MapVibe <span class="text-indigo-600">Pro Cloud</span></h1>
                <p id="cloud-status" class="text-[9px] font-black text-amber-500 uppercase tracking-widest flex items-center gap-2">
                    <span class="w-1.5 h-1.5 bg-amber-500 rounded-full animate-pulse"></span> Configurando Nube...
                </p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <label class="cursor-pointer bg-white border border-slate-200 px-5 py-2.5 rounded-2xl text-xs font-black uppercase hover:bg-slate-50 transition">
                Cargar Plano
                <input type="file" id="upload-input" class="hidden" accept="image/*,.pdf" onchange="processFile(event)">
            </label>
            <button onclick="shareMap()" class="bg-slate-900 text-white px-6 py-2.5 rounded-2xl text-xs font-black uppercase shadow-lg hover:bg-indigo-600 transition">
                Compartir Link
            </button>
        </div>
    </nav>

    <main class="flex h-[calc(100vh-140px)] gap-6">
        <aside class="w-72 glass-panel rounded-[2.5rem] p-6 shadow-xl hidden lg:flex flex-col gap-6">
            <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Marcadores en tiempo real</h2>
            <div id="marker-list" class="flex-1 overflow-y-auto space-y-3 pr-2"></div>
        </aside>

        <div id="map-container" class="flex-1 border-4 border-white shadow-2xl">
            <div id="map"></div>
        </div>
    </main>

    <div id="modal-editor" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[2000] hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-lg rounded-[3rem] p-10 shadow-2xl">
            <h3 class="text-2xl font-black text-slate-800 mb-6">Detalles de la Zona</h3>
            <div class="space-y-4">
                <input type="text" id="editor-title" placeholder="Nombre..." class="w-full px-6 py-4 bg-slate-50 rounded-2xl outline-none font-bold">
                <div id="editor-desc" contenteditable="true" class="w-full min-h-[150px] px-6 py-4 bg-slate-50 rounded-2xl outline-none text-sm overflow-y-auto"></div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="color" id="editor-color" value="#4f46e5" class="w-full h-12 rounded-2xl cursor-pointer">
                    <select id="editor-icon" class="w-full h-12 bg-slate-50 px-4 rounded-2xl text-sm font-bold">
                        <option value="📍">📍 Ubicación</option>
                        <option value="⚠️">⚠️ Alerta</option>
                        <option value="✅">✅ Revisado</option>
                    </select>
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button onclick="closeEditor()" class="flex-1 py-4 text-slate-400 text-xs font-black uppercase">Cancelar</button>
                <button onclick="saveToCloud()" class="flex-[2] py-4 bg-indigo-600 text-white text-xs font-black uppercase rounded-2xl shadow-lg">Guardar en Nube</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN DE FIREBASE (PASO 2 ABAJO) ---
        const firebaseConfig = {
           apiKey: "AIzaSyDnPiBbzVrVBP8j6DiBBwrYg-PVZrftEck",
  authDomain: "mapvibepro.firebaseapp.com",
  projectId: "mapvibepro",
  storageBucket: "mapvibepro.firebasestorage.app",
  messagingSenderId: "883985953230",
  appId: "1:883985953230:web:588883c6438c6ea6b6fb9f",
  measurementId: "G-DCBST5JKCJ"
        };
        // -----------------------------------------------

        let map, imageOverlay, db;
        let markers = [];
        let currentClickCoords = null;
        let mapId = new URLSearchParams(window.location.search).get('id') || 'mapa_principal';

        window.onload = function() {
            if (firebaseConfig.apiKey !== "TU_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                document.getElementById('cloud-status').innerHTML = '<span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span> Conectado a la Nube';
                listenToChanges();
            }

            map = L.map('map', { crs: L.CRS.Simple, minZoom: -3, maxZoom: 3, zoomControl: false, attributionControl: false });
            map.on('click', (e) => { currentClickCoords = e.latlng; openEditor(); });
            
            // Cargar imagen local si existe
            const savedImg = localStorage.getItem('last_plano');
            if (savedImg) setupMapImage(savedImg, 2000, 2000); 
        };

        async function processFile(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = e.target.result;
                localStorage.setItem('last_plano', img);
                setupMapImage(img, 2000, 2000);
            };
            reader.readAsDataURL(file);
        }

        function setupMapImage(url, w, h) {
            if (imageOverlay) map.removeLayer(imageOverlay);
            imageOverlay = L.imageOverlay(url, [[0, 0], [h, w]]).addTo(map);
            map.fitBounds([[0, 0], [h, w]]);
        }

        function openEditor() { document.getElementById('modal-editor').classList.remove('hidden'); }
        function closeEditor() { document.getElementById('modal-editor').classList.add('hidden'); }

        function saveToCloud() {
            const point = {
                title: document.getElementById('editor-title').value || "Punto",
                desc: document.getElementById('editor-desc').innerHTML,
                color: document.getElementById('editor-color').value,
                icon: document.getElementById('editor-icon').value,
                lat: currentClickCoords.lat,
                lng: currentClickCoords.lng,
                timestamp: Date.now()
            };

            if (db) {
                db.ref('maps/' + mapId + '/markers').push(point);
            } else {
                alert("Debes configurar Firebase para guardar en la nube.");
            }
            closeEditor();
        }

        function listenToChanges() {
            db.ref('maps/' + mapId + '/markers').on('value', (snapshot) => {
                const data = snapshot.val();
                markers = data ? Object.values(data) : [];
                renderMarkers();
            });
        }

        function renderMarkers() {
            map.eachLayer(l => { if (l instanceof L.Marker) map.removeLayer(l); });
            const list = document.getElementById('marker-list');
            list.innerHTML = "";

            markers.forEach(m => {
                const icon = L.divIcon({
                    className: '',
                    html: `<div class="custom-marker" style="background:${m.color}; width:30px; height:30px; border-radius:8px; color:white;">${m.icon}</div>`,
                    iconSize: [30, 30], iconAnchor: [15, 15]
                });
                L.marker([m.lat, m.lng], { icon }).addTo(map).bindPopup(`<b>${m.title}</b><br>${m.desc}`);
                
                const item = document.createElement('div');
                item.className = "bg-white p-3 rounded-xl border flex items-center gap-3 cursor-pointer hover:bg-slate-50";
                item.innerHTML = `<div class="w-1 h-6 rounded" style="background:${m.color}"></div><p class="text-[10px] font-bold uppercase truncate">${m.title}</p>`;
                item.onclick = () => map.panTo([m.lat, m.lng]);
                list.appendChild(item);
            });
        }

        function shareMap() {
            const url = window.location.origin + window.location.pathname + "?id=" + mapId;
            const temp = document.createElement('input');
            document.body.appendChild(temp);
            temp.value = url;
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            alert("Link compartido copiado: " + url);
        }
    </script>
</body>
</html>
