<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapVibe Pro Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        
        #map-container { 
            height: calc(100vh - 120px); 
            width: 100%; 
            position: relative; 
            background-color: #e2e8f0;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 2rem;
            overflow: hidden;
        }
        
        #map { height: 100%; width: 100%; background: transparent !important; z-index: 10;}
        
        /* FIX CRÍTICO: Evitar que Tailwind aplaste las imágenes de Leaflet */
        .leaflet-container img { max-width: none !important; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
        
        .custom-marker { display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3); border: 2px solid white; transition: transform 0.2s; cursor: pointer; }
        .custom-marker:hover { transform: scale(1.2); z-index: 1000 !important; }
        
        /* Estilos para tablas copiadas de Excel */
        .rich-text table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12px; }
        .rich-text th, .rich-text td { border: 1px solid #cbd5e1; padding: 6px; }
        .rich-text th { background-color: #f1f5f9; font-weight: bold; }
        .rich-text tr:nth-child(even) { background-color: #f8fafc; }
        
        [contenteditable=true]:empty:before { content: attr(placeholder); color: #94a3b8; pointer-events: none; display: block; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="h-screen overflow-hidden p-4 md:p-6">
    <nav class="h-20 mb-4 flex items-center justify-between px-4 glass-panel rounded-3xl shadow-sm">
        <div class="flex items-center gap-4">
            <div class="bg-indigo-600 p-3 rounded-2xl shadow-lg shadow-indigo-200">
                <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A2 2 0 013 15.482V4.742a2 2 0 011.132-1.803l5.447-2.724a2 2 0 011.842 0l5.447 2.724A2 2 0 0118 4.742v10.74a2 2 0 01-1.132 1.803L11.42 19.82a2 2 0 01-1.842 0z" /></svg>
            </div>
            <div>
                <h1 class="text-xl font-black text-slate-800 tracking-tight">MapVibe <span class="text-indigo-600 font-medium">Pro</span></h1>
                <div class="flex items-center gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest" id="cloud-status">
                    <span class="w-1.5 h-1.5 bg-yellow-500 rounded-full"></span> Modo Local
                </div>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <label id="btn-upload-plano" class="cursor-pointer bg-white hover:bg-slate-50 border border-slate-200 px-5 py-3 rounded-2xl transition-all shadow-sm flex items-center gap-2 group">
                <svg class="h-4 w-4 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                <span class="text-xs font-black text-slate-700 uppercase">Subir Plano</span>
                <input type="file" id="upload-input" class="hidden" accept="image/*" onchange="processFile(event)">
            </label>
            <button onclick="shareMap(event)" class="bg-indigo-600 text-white px-6 py-3 rounded-2xl text-xs font-black uppercase shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                Compartir
            </button>
        </div>
    </nav>

    <main class="flex h-[calc(100vh-140px)] gap-6">
        <!-- Sidebar -->
        <aside class="w-80 glass-panel rounded-[2.5rem] p-6 shadow-xl hidden lg:flex flex-col gap-4 transition-all">
            <div class="flex items-center justify-between border-b pb-4">
                <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Puntos Activos</h2>
            </div>
            <div id="marker-list" class="flex-1 overflow-y-auto space-y-3 custom-scrollbar pr-2">
                <div class="text-center py-10 opacity-50">
                    <p class="text-[11px] font-bold uppercase">Sube un plano para empezar</p>
                </div>
            </div>
        </aside>

        <!-- Map Area -->
        <div id="map-container" class="flex-1 shadow-2xl border-4 border-white relative">
            <div id="map"></div>
            
            <div id="empty-hint" class="absolute inset-0 z-[500] flex items-center justify-center pointer-events-none bg-slate-100/80 backdrop-blur-sm transition-opacity">
                <div id="hint-box" class="bg-white/90 px-8 py-6 rounded-[2rem] shadow-2xl border border-indigo-50 flex flex-col items-center gap-4 text-center">
                    <div class="bg-indigo-100 p-4 rounded-full">
                        <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                    <p class="text-sm font-black text-slate-800 uppercase tracking-wide">Sube un plano o mapa (JPG/PNG)</p>
                    <p class="text-[10px] font-bold text-slate-400">Haz clic en "Subir Plano" arriba</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Editor Modal -->
    <div id="modal-editor" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[2000] hidden flex items-center justify-center p-6 transition-opacity">
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] p-8 shadow-2xl">
            <h3 class="text-2xl font-black text-slate-800 mb-6">Detalles de la Zona</h3>
            <div class="space-y-4">
                <input type="text" id="editor-title" placeholder="Nombre de la zona..." class="w-full px-5 py-4 bg-slate-50 rounded-2xl outline-none font-bold focus:ring-2 focus:ring-indigo-500">
                <div id="editor-desc" contenteditable="true" placeholder="Escribe o pega tablas de Excel aquí..." class="w-full min-h-[120px] px-5 py-4 bg-slate-50 rounded-2xl outline-none text-sm overflow-y-auto rich-text custom-scrollbar focus:ring-2 focus:ring-indigo-500"></div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="color" id="editor-color" value="#4f46e5" class="w-full h-12 rounded-2xl cursor-pointer">
                    <select id="editor-icon" class="w-full h-12 bg-slate-50 px-4 rounded-2xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="📍">📍 Ubicación</option>
                        <option value="⚠️">⚠️ Alerta</option>
                        <option value="✅">✅ Revisado</option>
                    </select>
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button onclick="closeEditor()" class="flex-1 py-4 text-slate-400 text-xs font-black uppercase hover:bg-slate-50 rounded-2xl transition">Cancelar</button>
                <button onclick="savePoint()" class="flex-[2] py-4 bg-indigo-600 text-white text-xs font-black uppercase rounded-2xl shadow-lg hover:bg-indigo-700 transition">Guardar Punto</button>
            </div>
        </div>
    </div>

    <!-- View & Comments Modal -->
    <div id="modal-view" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[2000] hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] p-8 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-start mb-6">
                <div class="flex items-center gap-3">
                    <h3 id="view-title" class="text-2xl font-black text-slate-800"></h3>
                    <button id="btn-edit-zone" onclick="editZone()" class="hidden bg-yellow-100 text-yellow-700 hover:bg-yellow-200 px-3 py-1.5 rounded-xl text-[10px] font-black uppercase transition items-center gap-1 shadow-sm">
                        <svg class="w-3 h-3 inline-block mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        Editar
                    </button>
                </div>
                <button onclick="closeView()" class="bg-slate-100 text-slate-600 hover:bg-red-100 hover:text-red-600 w-8 h-8 rounded-full flex items-center justify-center transition font-bold">&times;</button>
            </div>
            
            <div id="view-desc" class="rich-text mb-6 overflow-y-auto max-h-40 text-sm text-slate-700 border-b pb-4 custom-scrollbar"></div>

            <div class="flex items-center justify-between mb-4">
                <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Comentarios</h4>
            </div>
            
            <div id="view-comments" class="flex-1 overflow-y-auto space-y-3 mb-6 custom-scrollbar pr-2">
                <!-- Comentarios en vivo se insertan aquí -->
            </div>

            <div class="mt-auto pt-4 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <div id="new-comment" contenteditable="true" placeholder="Escribe un comentario o pega una tabla de Excel..." class="w-full min-h-[50px] max-h-[120px] overflow-y-auto outline-none text-sm rich-text custom-scrollbar mb-3 bg-transparent p-2"></div>
                <button onclick="addComment()" class="w-full py-3 bg-indigo-600 text-white text-xs font-black uppercase rounded-xl shadow-md hover:bg-indigo-700 transition">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // === CONFIGURACIÓN FIREBASE (OPCIONAL/REEMPLAZABLE) ===
        const firebaseConfig = {
           apiKey: "AIzaSyDnPiBbzVrVBP8j6DiBBwrYg-PVZrftEck",
  authDomain: "mapvibepro.firebaseapp.com",
  projectId: "mapvibepro",
  storageBucket: "mapvibepro.firebasestorage.app",
  messagingSenderId: "883985953230",
  appId: "1:883985953230:web:588883c6438c6ea6b6fb9f",
  measurementId: "G-DCBST5JKCJ"
        };

        let map;
        let imageOverlay = null;
        let markers = [];
        let currentClickCoords = null;
        let mapId = new URLSearchParams(window.location.search).get('mapId') || "local_map_" + Math.random().toString(36).substr(2, 9);
        let db = null;
        let currentMarkerId = null;

        // NUEVAS VARIABLES PARA CONTROL DE EDICIÓN Y PERMISOS
        let editingMarkerId = null; 
        const isAdmin = new URLSearchParams(window.location.search).get('admin') === 'true';

        window.onload = function() {
            // Ocultar herramientas de administrador si el usuario es un invitado
            if(!isAdmin) {
                const btnUpload = document.getElementById('btn-upload-plano');
                if(btnUpload) btnUpload.style.display = 'none';
                
                const hintBox = document.getElementById('hint-box');
                if(hintBox) hintBox.innerHTML = '<p class="text-sm font-black text-slate-800 uppercase tracking-wide">Modo Visualización</p><p class="text-[10px] font-bold text-slate-400">Solo el administrador puede agregar zonas</p>';
            }

            // Inicializar Mapa con Zoom infinito y coordenadas Simples
            map = L.map('map', {
                crs: L.CRS.Simple,
                minZoom: -10, // FIX CRÍTICO: Permite imágenes gigantes sin error 404
                maxZoom: 5,
                zoomControl: false,
                attributionControl: false
            }).setView([0, 0], 0);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Evento click para agregar puntos
            map.on('click', function(e) {
                if(!imageOverlay) return; // No permitir puntos si no hay plano
                if(!isAdmin) return; // RESTRICCIÓN: Solo el administrador puede crear puntos
                
                currentClickCoords = e.latlng;
                editingMarkerId = null; // Reiniciar estado (es un punto nuevo, no una edición)
                
                document.getElementById('editor-title').value = "";
                document.getElementById('editor-desc').innerHTML = "";
                document.getElementById('modal-editor').classList.remove('hidden');
            });

            // Iniciar Firebase si está configurado (Fallback a local seguro)
            try {
                if (typeof firebase !== 'undefined' && firebaseConfig.apiKey !== "TU_API_KEY") {
                    firebase.initializeApp(firebaseConfig);
                    db = firebase.database();
                    document.getElementById('cloud-status').innerHTML = '<span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> Nube Conectada';
                    listenToChanges();
                } else {
                    // MODO LOCAL FALLBACK
                    loadLocalData();
                }
            } catch (e) {
                console.warn("Error iniciando Firebase, usando modo local.");
                loadLocalData();
            }

            // Ajuste dinámico del mapa al cargar la vista
            setTimeout(() => map.invalidateSize(), 500);
        };

        // === CARGAR IMAGEN AL MAPA ===
        function processFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert("Por favor sube una imagen válida (JPG/PNG).");
                return;
            }

            document.getElementById('hint-box').innerHTML = '<p class="text-sm font-black text-indigo-600 uppercase animate-pulse">Procesando plano...</p>';

            // Usamos URL.createObjectURL para velocidad instantánea sin QuotaExceededError
            const imgUrl = URL.createObjectURL(file);
            
            // Si hay Firebase, guardamos una versión comprimida para la red
            if (db) {
                compressAndUpload(file);
            } else {
                setupMapImage(imgUrl);
                // Guardado rápido local en Base64 para persistencia si no hay nube
                const reader = new FileReader();
                reader.onload = (e) => {
                    try { localStorage.setItem('mapvibe_local_base64', e.target.result); } catch(err) {} 
                };
                reader.readAsDataURL(file);
            }
        }

        function compressAndUpload(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    const max = 1500;
                    if (w > max || h > max) {
                        if (w > h) { h = Math.round((h * max) / w); w = max; }
                        else { w = Math.round((w * max) / h); h = max; }
                    }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const base64 = canvas.toDataURL('image/jpeg', 0.8);
                    
                    db.ref('maps/' + mapId + '/plano').set(base64)
                      .then(() => setupMapImage(base64))
                      .catch(err => console.error(err));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function setupMapImage(url) {
            const img = new Image();
            img.onload = function() {
                if (imageOverlay) map.removeLayer(imageOverlay);
                const w = this.width;
                const h = this.height;
                const bounds = [[0, 0], [h, w]];
                
                imageOverlay = L.imageOverlay(url, bounds).addTo(map);
                map.fitBounds(bounds);
                map.setMaxBounds(bounds);
                
                document.getElementById('empty-hint').style.display = 'none';
                setTimeout(() => map.invalidateSize(), 200);
            };
            img.onerror = () => {
                alert("Error al cargar la imagen. Intenta con otro archivo.");
                document.getElementById('hint-box').innerHTML = '<p class="text-sm font-black text-red-600 uppercase">Error de imagen</p>';
            };
            img.src = url;
        }

        // === GESTIÓN DE MARCADORES Y DATOS ===
        function closeEditor() {
            editingMarkerId = null;
            document.getElementById('modal-editor').classList.add('hidden');
        }

        function savePoint() {
            const title = document.getElementById('editor-title').value.trim() || "Nueva Zona";
            const desc = document.getElementById('editor-desc').innerHTML;
            const color = document.getElementById('editor-color').value;
            const icon = document.getElementById('editor-icon').value;

            if (editingMarkerId) {
                // ACTUALIZAR PUNTO EXISTENTE
                if (db) {
                    db.ref('maps/' + mapId + '/markers/' + editingMarkerId).update({ title, desc, color, icon });
                } else {
                    const idx = markers.findIndex(x => x.id === editingMarkerId);
                    if(idx > -1) {
                        markers[idx] = { ...markers[idx], title, desc, color, icon };
                        localStorage.setItem('mapvibe_local_markers', JSON.stringify(markers));
                        renderMarkers();
                    }
                }
            } else {
                // CREAR NUEVO PUNTO
                if(!currentClickCoords) return;
                const markerData = { title, desc, color, icon, lat: currentClickCoords.lat, lng: currentClickCoords.lng };

                if (db) {
                    db.ref('maps/' + mapId + '/markers').push(markerData);
                } else {
                    markerData.id = "local_" + Date.now();
                    markers.push(markerData);
                    localStorage.setItem('mapvibe_local_markers', JSON.stringify(markers));
                    renderMarkers();
                }
            }
            
            closeEditor();
        }

        function loadLocalData() {
            const savedMarkers = localStorage.getItem('mapvibe_local_markers');
            if (savedMarkers) {
                markers = JSON.parse(savedMarkers);
                renderMarkers();
            }
            const savedImg = localStorage.getItem('mapvibe_local_base64');
            if (savedImg) {
                setupMapImage(savedImg);
            }
        }

        function listenToChanges() {
            if (!db) return;
            
            db.ref('maps/' + mapId + '/markers').on('value', (snapshot) => {
                const data = snapshot.val();
                markers = data ? Object.entries(data).map(([id, val]) => ({ id, ...val })) : [];
                renderMarkers();
                
                if(currentMarkerId) {
                    const m = markers.find(x => x.id === currentMarkerId);
                    if(m) renderComments(m.comments || {});
                }
            });

            db.ref('maps/' + mapId + '/plano').on('value', (snapshot) => {
                const base64 = snapshot.val();
                if (base64) setupMapImage(base64);
            });
        }

        function renderMarkers() {
            map.eachLayer(l => { if (l instanceof L.Marker) map.removeLayer(l); });
            
            const list = document.getElementById('marker-list');
            list.innerHTML = "";

            if(markers.length === 0) {
                list.innerHTML = "<div class='text-center py-10 opacity-50'><p class='text-[11px] font-bold uppercase'>Sin puntos</p></div>";
                return;
            }

            markers.forEach((m) => {
                const customIcon = L.divIcon({
                    className: '',
                    html: `<div class="custom-marker" style="background:${m.color}; width:32px; height:32px; border-radius:10px; color:white; font-size:16px;">${m.icon}</div>`,
                    iconSize: [32, 32], 
                    iconAnchor: [16, 16]
                });

                const leafletMarker = L.marker([m.lat, m.lng], { icon: customIcon }).addTo(map);
                
                leafletMarker.bindPopup(`
                    <div class="p-2 w-48">
                        <b class="text-slate-800 text-sm block mb-2 truncate">${m.title}</b>
                        <button onclick="openView('${m.id}')" class="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-[10px] font-black uppercase py-2 rounded-xl transition">
                            Ver y Comentar
                        </button>
                    </div>
                `);
                
                const item = document.createElement('div');
                item.className = "bg-white p-3 rounded-2xl border-2 border-transparent hover:border-indigo-500 shadow-sm flex items-center gap-3 cursor-pointer transition";
                item.innerHTML = `<div class="w-2 h-8 rounded-full flex-shrink-0" style="background:${m.color}"></div><p class="text-[10px] font-black uppercase truncate text-slate-700">${m.title}</p>`;
                item.onclick = () => { map.flyTo([m.lat, m.lng]); openView(m.id); };
                list.appendChild(item);
            });
        }

        // === VISTA Y COMENTARIOS ===
        function openView(id) {
            currentMarkerId = id;
            const m = markers.find(x => x.id === id);
            if(!m) return;
            
            document.getElementById('view-title').innerText = m.icon + " " + m.title;
            document.getElementById('view-desc').innerHTML = m.desc || "<i class='text-slate-400'>Sin descripción adicional</i>";
            
            // Mostrar el botón de editar ÚNICAMENTE si eres tú (el Administrador)
            const btnEdit = document.getElementById('btn-edit-zone');
            if(btnEdit) btnEdit.style.display = isAdmin ? 'flex' : 'none';
            
            renderComments(m.comments || {});
            document.getElementById('modal-view').classList.remove('hidden');
        }

        // NUEVA FUNCIÓN: Pasar los datos a la ventana de edición
        function editZone() {
            if(!currentMarkerId || !isAdmin) return;
            const m = markers.find(x => x.id === currentMarkerId);
            if(!m) return;
            
            editingMarkerId = m.id; // Marcamos que estamos editando este ID
            document.getElementById('editor-title').value = m.title;
            document.getElementById('editor-desc').innerHTML = m.desc || "";
            document.getElementById('editor-color').value = m.color;
            document.getElementById('editor-icon').value = m.icon;
            
            closeView();
            document.getElementById('modal-editor').classList.remove('hidden');
        }

        function closeView() {
            currentMarkerId = null;
            document.getElementById('modal-view').classList.add('hidden');
        }

        function renderComments(commentsObj) {
            const container = document.getElementById('view-comments');
            container.innerHTML = "";
            const commentsList = Object.values(commentsObj).sort((a, b) => a.timestamp - b.timestamp);
            
            if (commentsList.length === 0) {
                container.innerHTML = "<p class='text-[11px] text-slate-400 italic text-center py-4'>Aún no hay comentarios. ¡Inicia la conversación!</p>";
                return;
            }

            commentsList.forEach(c => {
                const date = new Date(c.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                container.innerHTML += `
                    <div class="bg-indigo-50/50 p-3 rounded-2xl">
                        <span class="text-[9px] font-black text-indigo-400 uppercase tracking-wider block mb-1">${date}</span>
                        <div class="text-[12px] text-slate-700 rich-text">${c.text}</div>
                    </div>
                `;
            });
            container.scrollTop = container.scrollHeight;
        }

        function addComment() {
            if(!currentMarkerId) return;
            const textBox = document.getElementById('new-comment');
            const text = textBox.innerHTML;
            
            if(text.trim() === "" || text === "<br>") return;

            const commentData = { text: text, timestamp: Date.now() };

            if (db) {
                db.ref('maps/' + mapId + '/markers/' + currentMarkerId + '/comments').push(commentData);
            } else {
                // Modo local mock
                const m = markers.find(x => x.id === currentMarkerId);
                if(m) {
                    if(!m.comments) m.comments = {};
                    m.comments["c_" + Date.now()] = commentData;
                    localStorage.setItem('mapvibe_local_markers', JSON.stringify(markers));
                    renderComments(m.comments);
                }
            }
            textBox.innerHTML = ""; 
        }

        // === COMPARTIR LINK ===
        function shareMap(event) {
            // Genera la URL LIMPIA para el cliente (SIN el &admin=true)
            const url = window.location.origin + window.location.pathname + "?mapId=" + mapId;
            const temp = document.createElement('input');
            document.body.appendChild(temp);
            temp.value = url;
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            
            const btn = event.currentTarget;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> ¡Copiado!`;
            btn.classList.add('bg-green-500');
            btn.classList.remove('bg-indigo-600');
            
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.classList.remove('bg-green-500');
                btn.classList.add('bg-indigo-600');
            }, 2000);
        }
    </script>
</body>
