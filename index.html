<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapVibe Pro | Editor de Planos Inteligente</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        #map-container { 
            height: calc(100vh - 120px); 
            border-radius: 2rem;
            background-color: #f1f5f9;
            background-image: radial-gradient(#cbd5e1 0.8px, transparent 0.8px);
            background-size: 24px 24px;
            overflow: hidden;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
            position: relative;
        }

        #map { height: 100%; width: 100%; background: transparent !important; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .custom-marker {
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid white;
        }

        .loader-active { display: flex !important; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-pop { animation: fadeInScale 0.3s ease-out forwards; }

        /* Estilo para tablas de Excel pegadas */
        #editor-desc table { border-collapse: collapse; width: 100%; margin: 10px 0; border: 1px solid #e2e8f0; }
        #editor-desc td { border: 1px solid #e2e8f0; padding: 6px; font-size: 0.8rem; }
    </style>
</head>
<body class="h-screen overflow-hidden p-4 md:p-6">

    <nav class="h-16 mb-6 flex items-center justify-between px-2">
        <div class="flex items-center gap-4">
            <div class="bg-indigo-600 p-2.5 rounded-2xl shadow-xl shadow-indigo-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-extrabold text-slate-800 tracking-tight">MapVibe <span class="text-indigo-600">Pro</span></h1>
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2">
                    <span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span> Sistema en la Nube
                </p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <label class="cursor-pointer bg-white hover:bg-indigo-50 border border-slate-200 px-5 py-2.5 rounded-2xl transition-all flex items-center gap-3 shadow-sm group">
                <span class="text-xs font-black text-slate-700 uppercase">Cargar Plano</span>
                <input type="file" id="upload-input" class="hidden" accept="image/*,.pdf" onchange="processFile(event)">
            </label>
            <button onclick="showPublishModal()" class="bg-slate-900 text-white px-6 py-2.5 rounded-2xl text-xs font-black uppercase shadow-lg hover:bg-indigo-600 transition-all">
                Publicar
            </button>
        </div>
    </nav>

    <main class="flex h-[calc(100vh-140px)] gap-6">
        <aside class="w-80 glass-panel rounded-[2.5rem] p-6 shadow-xl hidden lg:flex flex-col gap-6">
            <div class="flex items-center justify-between">
                <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Puntos en Plano</h2>
                <span id="counter" class="bg-indigo-100 text-indigo-600 text-[10px] font-black px-2.5 py-1 rounded-lg">0</span>
            </div>
            
            <div id="marker-list" class="flex-1 overflow-y-auto space-y-3 pr-2 custom-scrollbar">
                <div class="text-center py-20 opacity-30">
                    <p class="text-[10px] font-bold uppercase">Sube un plano para comenzar</p>
                </div>
            </div>
        </aside>

        <div id="map-container" class="flex-1 border-4 border-white shadow-2xl">
            <div id="map"></div>
            
            <div id="empty-notice" class="absolute inset-0 z-[500] flex items-center justify-center pointer-events-none transition-all duration-500">
                <div class="bg-white/90 backdrop-blur px-10 py-8 rounded-[3rem] shadow-2xl border border-indigo-50 text-center">
                    <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                    </div>
                    <p class="text-xs font-black text-slate-800 uppercase tracking-widest">Suelta tu plano aquí</p>
                    <p class="text-[10px] text-slate-400 mt-2">Formatos aceptados: PDF, JPG, PNG</p>
                </div>
            </div>

            <div id="global-loader" class="hidden absolute inset-0 z-[1000] bg-white/60 backdrop-blur-md flex flex-col items-center justify-center">
                <div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Procesando geometría...</p>
            </div>
        </div>
    </main>

    <div id="modal-editor" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[2000] hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-lg rounded-[3rem] p-10 shadow-2xl animate-pop">
            <div class="mb-6">
                <h3 class="text-2xl font-black text-slate-800">Detalles del Punto</h3>
                <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">Puedes pegar tablas de Excel directamente</p>
            </div>
            
            <div class="space-y-4">
                <input type="text" id="editor-title" placeholder="Nombre de la zona..." class="w-full px-6 py-4 bg-slate-50 border-2 border-transparent focus:border-indigo-500 rounded-2xl outline-none font-bold text-slate-700 transition-all">
                <div id="editor-desc" contenteditable="true" class="w-full min-h-[150px] max-h-[250px] overflow-y-auto px-6 py-4 bg-slate-50 border-2 border-transparent focus:border-indigo-500 rounded-2xl outline-none text-sm text-slate-600 custom-scrollbar"></div>
                
                <div class="grid grid-cols-2 gap-4">
                    <input type="color" id="editor-color" value="#4f46e5" class="w-full h-12 rounded-2xl cursor-pointer border-none p-0">
                    <select id="editor-icon" class="w-full h-12 bg-slate-50 px-4 rounded-2xl text-sm font-bold border-none outline-none">
                        <option value="📍">📍 Ubicación</option>
                        <option value="⚠️">⚠️ Alerta</option>
                        <option value="✅">✅ Revisado</option>
                        <option value="⚡">⚡ Energía</option>
                    </select>
                </div>
            </div>

            <div class="mt-8 flex gap-3">
                <button onclick="closeEditor()" class="flex-1 py-4 text-slate-400 text-xs font-black uppercase">Cancelar</button>
                <button onclick="saveCurrentPoint()" class="flex-[2] py-4 bg-indigo-600 text-white text-xs font-black uppercase rounded-2xl shadow-lg hover:bg-indigo-700 transition">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let map, imageOverlay;
        let markers = [];
        let currentClickCoords = null;
        let editingIndex = null;
        let currentPlanoBase64 = null;

        window.onload = function() {
            map = L.map('map', {
                crs: L.CRS.Simple,
                minZoom: -3,
                maxZoom: 3,
                zoomControl: false,
                attributionControl: false
            });

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            map.on('click', function(e) {
                if (!currentPlanoBase64) return;
                currentClickCoords = e.latlng;
                openEditor();
            });

            const saved = localStorage.getItem('mapvibe_pro_github');
            if (saved) {
                const data = JSON.parse(saved);
                if (data.image) {
                    currentPlanoBase64 = data.image;
                    setupMapImage(data.image, data.w, data.h);
                    markers = data.markers || [];
                    renderMarkers();
                }
            }
        };

        async function processFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('global-loader').classList.add('loader-active');

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64 = e.target.result;
                
                if (file.type === "application/pdf") {
                    const pdf = await pdfjsLib.getDocument({ data: atob(base64.split(',')[1]) }).promise;
                    const page = await pdf.getPage(1);
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    const imgUrl = canvas.toDataURL('image/png');
                    currentPlanoBase64 = imgUrl;
                    setupMapImage(imgUrl, canvas.width, canvas.height);
                } else {
                    const img = new Image();
                    img.onload = function() {
                        currentPlanoBase64 = base64;
                        setupMapImage(base64, img.width, img.height);
                    };
                    img.src = base64;
                }
                document.getElementById('global-loader').classList.remove('loader-active');
            };
            reader.readAsDataURL(file);
        }

        function setupMapImage(url, w, h) {
            if (imageOverlay) map.removeLayer(imageOverlay);
            const bounds = [[0, 0], [h, w]];
            imageOverlay = L.imageOverlay(url, bounds).addTo(map);
            map.fitBounds(bounds);
            map.setMaxBounds(bounds);
            document.getElementById('empty-notice').classList.add('opacity-0');
            setTimeout(() => document.getElementById('empty-notice').classList.add('hidden'), 500);
            saveToLocal();
        }

        function openEditor(index = null) {
            editingIndex = index;
            const modal = document.getElementById('modal-editor');
            if (index !== null) {
                const m = markers[index];
                document.getElementById('editor-title').value = m.title;
                document.getElementById('editor-desc').innerHTML = m.desc;
                document.getElementById('editor-color').value = m.color;
                document.getElementById('editor-icon').value = m.icon;
            } else {
                document.getElementById('editor-title').value = "";
                document.getElementById('editor-desc').innerHTML = "";
            }
            modal.classList.remove('hidden');
        }

        function closeEditor() { document.getElementById('modal-editor').classList.add('hidden'); }

        function saveCurrentPoint() {
            const title = document.getElementById('editor-title').value || "Sin nombre";
            const desc = document.getElementById('editor-desc').innerHTML;
            const color = document.getElementById('editor-color').value;
            const icon = document.getElementById('editor-icon').value;

            const point = {
                title, desc, color, icon,
                lat: editingIndex !== null ? markers[editingIndex].lat : currentClickCoords.lat,
                lng: editingIndex !== null ? markers[editingIndex].lng : currentClickCoords.lng
            };

            if (editingIndex !== null) markers[editingIndex] = point;
            else markers.push(point);

            renderMarkers();
            saveToLocal();
            closeEditor();
        }

        function renderMarkers() {
            map.eachLayer(l => { if (l instanceof L.Marker) map.removeLayer(l); });
            const list = document.getElementById('marker-list');
            list.innerHTML = "";
            document.getElementById('counter').innerText = markers.length;

            markers.forEach((m, i) => {
                const customIcon = L.divIcon({
                    className: '',
                    html: `<div class="custom-marker" style="background:${m.color}; width:30px; height:30px; border-radius:8px; color:white;">${m.icon}</div>`,
                    iconSize: [30, 30], iconAnchor: [15, 15]
                });

                L.marker([m.lat, m.lng], { icon: customIcon }).addTo(map).on('click', () => openEditor(i));
                
                const item = document.createElement('div');
                item.className = "bg-white p-4 rounded-2xl border border-slate-100 flex items-center gap-4 cursor-pointer hover:border-indigo-300 transition";
                item.innerHTML = `
                    <div class="w-1.5 h-6 rounded-full" style="background:${m.color}"></div>
                    <p class="text-[11px] font-black text-slate-700 truncate uppercase">${m.title}</p>
                `;
                item.onclick = () => map.flyTo([m.lat, m.lng], 0);
                list.appendChild(item);
            });
        }

        function saveToLocal() {
            const data = {
                image: currentPlanoBase64,
                markers: markers,
                w: imageOverlay ? imageOverlay._image.naturalWidth : 0,
                h: imageOverlay ? imageOverlay._image.naturalHeight : 0
            };
            localStorage.setItem('mapvibe_pro_github', JSON.stringify(data));
        }

        function showPublishModal() {
            alert("¡Proyecto listo! Para que otros lo vean, sube este archivo a GitHub Pages siguiendo la guía.");
        }
    </script>
</body>
</html>
